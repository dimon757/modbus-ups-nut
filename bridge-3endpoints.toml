# bridge.toml: 2 Windows 11 endpoints, 1 Proxmox endpoint (vms_then_poweroff)
wol_broadcast_addr = "127.0.0.1:40009"      # wol_listen.py, not the LAN
state_file = "/tmp/mub-test/shutdown_fired" # test run marker
ssh_known_hosts_file = "/tmp/mub-test/known_hosts"

[modbus]
device = "/tmp/mub-test/ttyBR"   # bridge end of the socat virtual cable
baud_rate = 9600
slave_id = 1
poll_interval_secs = 1

[thresholds]
grid_lost_voltage = 100.0
on_battery_debounce_secs = 5     # test timing: 5s
low_battery_fast_debounce_secs = 2 # test timing: 2s
low_battery_soc = 30.0
inverter_cutoff_soc = 20.0
recovery_debounce_secs = 10      # test timing: 10s
stagger_secs = 2                 # test timing: 2s
wol_resend_count = 3             # 4 rounds total (1 initial + 3 resends)
wol_resend_interval_secs = 5     # 5s interval
ssh_connect_retry_secs = 6
comms_loss_shutdown_secs = 5

# Endpoint 1: Windows 11
[[endpoints]]
name = "ws-1"
kind = "windows"
host = "10.99.0.1"
ssh_user = "ups-shutdown"
ssh_key_path = "/tmp/mub-test/fake_key"
shutdown_delay_secs = 60
mac_address = "AA:BB:CC:00:00:01"

# Endpoint 2: Windows 11
[[endpoints]]
name = "ws-2"
kind = "windows"
host = "10.99.0.2"
ssh_user = "ups-shutdown"
ssh_key_path = "/tmp/mub-test/fake_key"
shutdown_delay_secs = 60
mac_address = "AA:BB:CC:00:00:02"

# Endpoint 3: Proxmox
[[endpoints]]
name = "proxmox"
kind = "proxmox"
host = "10.99.0.3"
ssh_user = "root"
ssh_key_path = "/tmp/mub-test/fake_key"
shutdown_delay_secs = 10
mac_address = "AA:BB:CC:00:00:03"
ssh_connect_retry_secs = 12

[proxmox]
method = "vms_then_poweroff"
vm_shutdown_timeout_secs = 15
