# Journal (log) settings for the modbus-ups-bridge box.
# Install to /etc/systemd/journald.conf.d/modbus-ups-bridge.conf, then:
#   sudo systemctl restart systemd-journald
# See docs/installation.md, step 10.
#
# The bridge writes no log file of its own: its output goes to the journal,
# which rotates itself within these limits -- no logrotate needed.

[Journal]
# Keep the journal on the SSD so it survives reboots and power cuts --
# after an outage, that's where to see what the bridge did.
Storage=persistent
# Rotation: at most 1 GB in total; the oldest entries are deleted first.
SystemMaxUse=1G
# ...and never leave less than 5 GB free on the SSD.
SystemKeepFree=5G
# A new journal file every month; entries older than a year are deleted.
MaxFileSec=1month
MaxRetentionSec=1year
