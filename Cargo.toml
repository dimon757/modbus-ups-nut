[package]
name = "modbus-ups-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "signal"] }
tokio-serial = "5"
tokio-modbus = { version = "0.11", default-features = false, features = ["rtu"] }
serde = { version = "1", features = ["derive"] }
toml = "0.7"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 2
panic = "abort"
